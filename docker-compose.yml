services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: local-demo-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      retries: 10

  backend:
    build: ./app/backend
    environment:
      DJANGO_SECRET_KEY: local-demo-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      POSTGRES_HOST: database
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "8005:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./app/frontend
    ports:
      - "8085:80"
    depends_on:
      - backend
